                options: [
                    { value: 0, label: '0 pts - Estrangulamiento mecánico' },
                    { value: 1, label: '1 pt - Control On/Off' },
                    { value: 2, label: '2 pts - Motores de 2 velocidades' },
                    { value: 3, label: '3 pts - VSD en equipos principales' },
                    { value: 4, label: '4 pts - VSD generalizado con lazo cerrado' }
                ]
            },
            // --- NIVELES DE DESEMPEÑO (EEPL) ---
            {
                id: 'A.2.1',
                category: 'EEPL',
                categoryTitle: 'Nivel de Desempeño (EEPL)',
                title: 'Distribución del Consumo Anual',
                description: 'Capacidad de discriminar el consumo.',
                details: `<b>Balance:</b> Porcentaje del consumo total que puede ser asignado a usos específicos mediante medición.`,
                options: [
                    { value: 0, label: '0 pts - Sin discriminación' },
                    { value: 1, label: '1 pt - 75% discriminado' },
                    { value: 2, label: '2 pts - 85% discriminado' },
                    { value: 3, label: '3 pts - 90% discriminado' },
                    { value: 4, label: '4 pts - 94% discriminado por zonas y uso' }
                ]
            },
            {
                id: 'A.2.2',
                category: 'EEPL',
                categoryTitle: 'Nivel de Desempeño (EEPL)',
                title: 'Factor de Potencia (Resultado)',
                description: 'Valor medio obtenido.',
                details: `<b>Resultado:</b> Eficiencia lograda en la reducción de reactiva.`,
                options: [
                    { value: 0, label: '0 pts - < 0.85' },
                    { value: 1, label: '1 pt - > 0.85' },
                    { value: 2, label: '2 pts - > 0.90' },
                    { value: 3, label: '3 pts - > 0.93' },
                    { value: 4, label: '4 pts - > 0.95' }
                ]
            },
            {
                id: 'A.2.3',
                category: 'EEPL',
                categoryTitle: 'Nivel de Desempeño (EEPL)',
                title: 'Eficiencia del Transformador',
                description: 'Eficiencia operativa real.',
                details: `<b>Punto de Operación:</b> Factor de carga y eficiencia resultante.`,
                options: [
                    { value: 0, label: '0 pts - Desconocida / Baja' },
                    { value: 1, label: '1 pt - > 95%' },
                    { value: 2, label: '2 pts - > 97%' },
                    { value: 3, label: '3 pts - > 98%' },
                    { value: 4, label: '4 pts - > 99% (Carga óptima)' }
                ]
            },
        ];

        const App = () => {
            const [buildingType, setBuildingType] = useState('industrial'); 
            const [clientName, setClientName] = useState('');
            const [scores, setScores] = useState({});
            const [totalScore, setTotalScore] = useState(0);
            const [eiecClass, setEiecClass] = useState('EIEC 0');
            const [showReport, setShowReport] = useState(false);
            const [expandedDetails, setExpandedDetails] = useState(null);
            const [isExporting, setIsExporting] = useState(false);
            const [recommendation, setRecommendation] = useState(null);

            useEffect(() => {
                const initialScores = {};
                parameters.forEach(p => initialScores[p.id] = 0);
                setScores(initialScores);
            }, []);

            useEffect(() => {
                const total = Object.values(scores).reduce((a, b) => a + b, 0);
                setTotalScore(total);

                let result = 'EIEC 0';
                // Lógica AEA:
                if (total < 24) result = 'EIEC 0';
                else if (total < 36) result = 'EIEC 1';
                else if (total < 48) result = 'EIEC 2';
                else if (total < 60) result = 'EIEC 3';
                else result = 'EIEC 4';
                
                setEiecClass(result);
                setRecommendation(getRecommendations(result, buildingType));
            }, [scores, buildingType]);

            const handleScoreChange = (id, value) => setScores(prev => ({...prev, [id]: parseInt(value)}));
            const toggleDetails = (id) => setExpandedDetails(expandedDetails === id ? null : id);
            
            const resetCalculator = () => {
                const newScores = {};
                parameters.forEach(p => newScores[p.id] = 0);
                setScores(newScores);
                setEiecClass('EIEC 0');
                setClientName('');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const getEiecColor = (cls) => {
                switch(cls) {
                    case 'EIEC 0': return 'bg-red-500 text-white border-red-600';
                    case 'EIEC 1': return 'bg-orange-500 text-white border-orange-600';
                    case 'EIEC 2': return 'bg-yellow-400 text-black border-yellow-500';
                    case 'EIEC 3': return 'bg-lime-500 text-black border-lime-600';
                    case 'EIEC 4': return 'bg-emerald-600 text-white border-emerald-700';
                    default: return 'bg-gray-400 text-white';
                }
            };

            const handleExportPdf = () => {
                setIsExporting(true);
                const element = document.getElementById('report-content');
                const opt = {
                    margin: 5,
                    filename: `IE_Reporte_EIEC_${clientName.replace(/\s+/g, '_') || 'Cliente'}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
                };
                
                // Pequeño delay para asegurar que React actualizó el DOM
                setTimeout(() => {
                    html2pdf().set(opt).from(element).save().then(() => setIsExporting(false));
                }, 500);
            };

            // Componente de Radar
            const RadarChartComponent = ({ scores }) => {
                const dataValues = [
                    ((scores['A.1.2'] + scores['A.1.7'] + scores['A.1.6']) / 12) * 100, // Infraestructura
                    ((scores['A.1.3'] + scores['A.1.4'] + scores['A.1.5'] + scores['A.1.14']) / 16) * 100, // Equipos
                    ((scores['A.1.8'] + scores['A.1.12'] + scores['A.1.10']) / 12) * 100, // Calidad
                    ((scores['A.1.9'] + scores['A.2.1'] + scores['A.1.1']) / 12) * 100, // Gestión
                    ((scores['A.1.13']) / 4) * 100 // Renovables
                ];
                const config = {
                    type: 'radar',
                    data: {
                        labels: ['Infraestructura', 'Equipos', 'Calidad Red', 'Gestión', 'Renovables'],
                        datasets: [{ label: 'Estado Actual', data: dataValues, fill: true, backgroundColor: 'rgba(14, 165, 233, 0.4)', borderColor: '#0ea5e9' }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { r: { min: 0, max: 100, ticks: { display: false } } }, plugins: { legend: { display: false } } }
                };
                return <ChartComponent config={config} />;
            };

            // Componente de Barras Horizontales con ESTILOS EN LÍNEA para PDF
            const HorizontalBarChart = ({ items, scoreData }) => {
                return (
                    <div className="space-y-4 w-full">
                        {items.map((item) => {
                            const score = scoreData[item.id] || 0;
                            const percentage = (score / 4) * 100;
                            
                            let barColor = '#e2e8f0'; // slate-200
                            if (score === 4) barColor = '#10b981'; // emerald-500
                            else if (score >= 2) barColor = '#3b82f6'; // blue-500
                            else if (score > 0) barColor = '#fb923c'; // orange-400

                            return (
                                <div key={item.id} className="flex items-center text-xs sm:text-sm avoid-break w-full">
                                    <div className="w-12 font-bold text-slate-500 flex-shrink-0">{item.id}</div>
                                    <div className="flex-1">
                                        <div className="flex justify-between mb-1">
                                            <span className="font-medium text-slate-700 truncate pr-2" title={item.title}>{item.title}</span>
                                            <span className="font-bold text-slate-900">{score}/4</span>
                                        </div>
                                        <div style={{ width: '100%', backgroundColor: '#f1f5f9', borderRadius: '9999px', height: '10px', overflow: 'hidden' }}>
                                            <div 
                                                style={{ width: `${percentage}%`, backgroundColor: barColor, height: '100%', borderRadius: '9999px', transition: 'width 0.5s' }}
                                            ></div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                );
            };

            const emParams = parameters.filter(p => p.category === 'EM');
            const eeplParams = parameters.filter(p => p.category === 'EEPL');

            return (
                <div className="min-h-screen bg-slate-50 font-sans pb-24">
                    
                    {/* NAVBAR — Estética unificada Portal IE */}
                    <header className="bg-gradient-to-r from-blue-900 to-indigo-900 text-white shadow-lg sticky top-0 z-20 no-print">
                        <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-white/10 rounded border border-white/20">
                                    <span className="font-black text-xl tracking-tighter">IE</span>
                                </div>
                                <div>
                                    <h1 className="text-base sm:text-lg font-bold leading-tight">Inteligencia Energética <span className="text-blue-200 font-medium">— Herramientas de Ingeniería</span></h1>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <a 
                                    href="https://youtu.be/4wcmu9xsBdM" 
                                    target="_blank" 
                                    className="text-xs bg-red-600 hover:bg-red-700 px-3 py-2 rounded font-bold transition-colors flex items-center gap-2"
                                    title="Ver video explicativo AEA 90364-8"
                                >
                                    <Icons.Video /> VIDEO GUÍA
                                </a>
                                <button onClick={() => setShowReport(true)} className="text-xs bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded font-bold transition-colors flex items-center gap-2">
                                    <Icons.FileText /> REPORTE
                                </button>
                                <button onClick={resetCalculator} className="text-xs bg-white/10 hover:bg-white/20 px-3 py-2 rounded text-blue-100 transition-colors">
                                    <Icons.RotateCcw />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CALCULATOR */}
                    {!showReport && (
                        <main className="max-w-4xl mx-auto px-4 py-8 animate-in fade-in duration-500 no-print">
                            
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8">
                                <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2 border-b pb-2">
                                    <Icons.User /> Datos del Cliente
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase">Empresa / Cliente</label>
                                        <input type="text" value={clientName} onChange={(e) => setClientName(e.target.value)} placeholder="Ej. Planta Industrial Córdoba" className="w-full mt-1 p-3 border rounded bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase">Tipo de Industria</label>
                                        <div className="flex gap-2 mt-1">
                                            <button onClick={() => setBuildingType('industrial')} className={`flex-1 p-3 rounded border text-sm font-bold ${buildingType === 'industrial' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-500'}`}>INDUSTRIAL</button>
                                            <button onClick={() => setBuildingType('residential')} className={`flex-1 p-3 rounded border text-sm font-bold ${buildingType === 'residential' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-500'}`}>RESIDENCIAL</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-4">
                                {parameters.map((param) => (
                                    <div key={param.id} className="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow">
                                        <div className="p-4 flex items-center gap-4">
                                            <div className="w-16 text-center">
                                                <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-1 rounded block">{param.id}</span>
                                            </div>
                                            <div className="flex-1">
                                                <div className="flex items-center gap-2">
                                                    <h3 className="font-bold text-slate-800">{param.title}</h3>
                                                    <button onClick={() => toggleDetails(param.id)} className="text-slate-400 hover:text-blue-500"><Icons.HelpCircle /></button>
                                                </div>
                                                <p className="text-xs text-slate-500">{param.description}</p>
                                            </div>
                                            <div className="w-64">
                                                <select value={scores[param.id]} onChange={(e) => handleScoreChange(param.id, e.target.value)} className="w-full p-2 text-xs border rounded bg-slate-50 font-bold text-slate-700 cursor-pointer focus:ring-2 focus:ring-blue-500 outline-none truncate">
                                                    {param.options.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                        
                                        {/* DETALLES TÉCNICOS + GRÁFICO */}
                                        {expandedDetails === param.id && (
                                            <div className="bg-slate-50 border-t border-slate-200 p-4 animate-in slide-in-from-top-2">
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                    <div className={`${param.chartConfig ? 'md:col-span-2' : 'md:col-span-3'}`}>
                                                        <h4 className="text-xs font-bold text-blue-800 uppercase mb-2">Criterio Técnico AEA</h4>
                                                        <p className="text-sm text-slate-600 leading-relaxed" dangerouslySetInnerHTML={{__html: param.details}} />
                                                    </div>
                                                    {param.chartConfig && (
                                                        <div className="bg-white p-2 rounded border h-48">
                                                            <ChartComponent config={param.chartConfig} />
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </main>
                    )}

                    {/* MODAL DE REPORTE */}
                    {showReport && recommendation && (
                        <div className="fixed inset-0 bg-slate-900/50 z-50 overflow-y-auto backdrop-blur-sm">
                            <div className="min-h-screen px-4 py-8 flex justify-center">
                                <div className="bg-white w-full max-w-5xl rounded-xl shadow-2xl overflow-hidden flex flex-col h-fit">
                                    
                                    {/* Toolbar Reporte */}
                                    <div className="p-4 bg-slate-100 border-b flex justify-between items-center no-print sticky top-0 z-10">
                                        <h2 className="font-bold text-slate-700 flex items-center gap-2"><Icons.FileText /> Vista Previa del Informe</h2>
                                        <div className="flex gap-2">
                                            <button onClick={() => setShowReport(false)} className="px-4 py-2 text-sm font-bold text-slate-600 hover:bg-slate-200 rounded">Cerrar</button>
                                            <button onClick={handleExportPdf} disabled={isExporting} className="px-4 py-2 text-sm font-bold bg-blue-600 text-white hover:bg-blue-700 rounded flex items-center gap-2">
                                                {isExporting ? <Icons.Loader /> : <Icons.Download />} {isExporting ? 'Generando...' : 'Descargar PDF'}
                                            </button>
                                        </div>
                                    </div>

                                    {/* CONTENIDO DEL PDF */}
                                    <div id="report-content" className="pdf-content p-8 md:p-12">
                                        
                                        {/* Cabecera Informe */}
                                        <div className="flex justify-between items-end border-b-4 border-blue-600 pb-6 mb-8">
                                            <div>
                                                <div className="text-4xl font-black text-slate-900 tracking-tight">IE</div>
                                                <div className="text-sm font-bold text-slate-500 uppercase tracking-widest">Inteligencia Energética</div>
                                                <div className="text-xs text-slate-400 mt-1">Ingeniería & Gestión de Activos</div>
                                            </div>
                                            <div className="text-right">
                                                <h1 className="text-2xl font-bold text-slate-800">INFORME TÉCNICO EIEC</h1>
                                                <p className="text-sm text-slate-500">Ref: AEA 90364-8-1</p>
                                                <div className="mt-2 text-sm font-medium bg-slate-100 px-3 py-1 rounded inline-block">
                                                    Cliente: {clientName || '---'}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Dashboard Resultados */}
                                        <div className="grid grid-cols-3 gap-8 mb-8 avoid-break">
                                            <div className="col-span-1 bg-slate-50 rounded-xl border border-slate-200 p-6 flex flex-col justify-center items-center text-center">
                                                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Clasificación Obtenida</span>
                                                <div className={`text-5xl font-black px-6 py-2 rounded-lg border-2 mb-2 bg-white ${getEiecColor(eiecClass).replace('text-white', 'text-slate-800').replace('bg-', 'border-')}`}>
                                                    {eiecClass}
                                                </div>
                                                <div className="text-3xl font-bold text-slate-800">{totalScore}</div>
                                                <div className="text-xs text-slate-500 uppercase mt-1">Puntaje Total</div>
                                            </div>
                                            <div className="col-span-2 bg-white rounded-xl border border-slate-200 p-4 h-64 relative">
                                                <span className="absolute top-4 left-4 text-xs font-bold text-slate-400 uppercase">Análisis de Brechas</span>
                                                <RadarChartComponent scores={scores} />
                                            </div>
                                        </div>

                                        {/* PLAN DE ACCIÓN EXPERTO */}
                                        <div className="mb-8 avoid-break">
                                            <h3 className="text-lg font-bold text-slate-800 border-b pb-2 mb-4 flex items-center gap-2">
                                                <Icons.Activity /> Plan de Acción Sugerido
                                            </h3>
                                            
                                            <div className={`bg-${recommendation.color}-50 border-l-4 border-${recommendation.color}-500 p-6 rounded-r-lg mb-6`}>
                                                <h4 className={`text-xl font-bold text-${recommendation.color}-800 mb-2`}>{recommendation.title}</h4>
                                                <p className={`text-${recommendation.color}-900 font-medium italic mb-4`}>"{recommendation.diagnosis}"</p>
                                                
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div className="bg-white p-4 rounded shadow-sm border border-slate-100">
                                                        <h5 className="font-bold text-slate-700 text-xs uppercase mb-2 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-red-500"></span> Inmediato / Seguridad</h5>
                                                        <ul className="text-sm text-slate-600 list-disc list-inside">
                                                            {recommendation.actions.filter(a => a.type === 'inmediata').map((a, i) => <li key={i}>{a.text}</li>)}
                                                        </ul>
                                                    </div>
                                                    <div className="bg-white p-4 rounded shadow-sm border border-slate-100">
                                                        <h5 className="font-bold text-slate-700 text-xs uppercase mb-2 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-blue-500"></span> CAPEX (Inversión)</h5>
                                                        <ul className="text-sm text-slate-600 list-disc list-inside">
                                                            {recommendation.actions.filter(a => a.type === 'capex').map((a, i) => <li key={i}>{a.text}</li>)}
                                                        </ul>
                                                    </div>
                                                    <div className="bg-white p-4 rounded shadow-sm border border-slate-100">
                                                        <h5 className="font-bold text-slate-700 text-xs uppercase mb-2 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-orange-500"></span> Mantenimiento (RCM)</h5>
                                                        <ul className="text-sm text-slate-600 list-disc list-inside">
                                                            {recommendation.actions.filter(a => a.type === 'mantenimiento').map((a, i) => <li key={i}>{a.text}</li>)}
                                                        </ul>
                                                    </div>
                                                    <div className="bg-white p-4 rounded shadow-sm border border-slate-100">
                                                        <h5 className="font-bold text-slate-700 text-xs uppercase mb-2 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-green-500"></span> Gestión & Lean</h5>
                                                        <ul className="text-sm text-slate-600 list-disc list-inside">
                                                            {recommendation.actions.filter(a => a.type === 'gestion').map((a, i) => <li key={i}>{a.text}</li>)}
                                                        </ul>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* DETALLE DE PUNTUACIÓN (BARRAS HORIZONTALES) */}
                                        <div className="space-y-8">
                                            <div className="bg-white avoid-break">
                                                <h3 className="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                                                    <span className="text-blue-600"><Icons.BarChart2 /></span> 
                                                    Medidas de Eficiencia (EM)
                                                </h3>
                                                <div className="bg-slate-50 p-6 rounded-xl border border-slate-100">
                                                    <HorizontalBarChart items={emParams} scoreData={scores} />
                                                </div>
                                            </div>

                                            <div className="bg-white avoid-break">
                                                <h3 className="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                                                    <span className="text-emerald-600"><Icons.BarChart2 /></span> 
                                                    Nivel de Desempeño (EEPL)
                                                </h3>
                                                <div className="bg-slate-50 p-6 rounded-xl border border-slate-100">
                                                    <HorizontalBarChart items={eeplParams} scoreData={scores} />
                                                </div>
                                            </div>
                                        </div>

                                        {/* RECURSOS Y REFERENCIAS (NUEVO) */}
                                        <div className="mt-8 pt-4 border-t border-slate-200 avoid-break">
                                            <h4 className="text-sm font-bold text-slate-700 mb-2">Referencias Normativas & Recursos</h4>
                                            <ul className="text-xs text-slate-500 list-disc list-inside">
                                                <li>Reglamentación AEA 90364-8-1 (Ed. 2019) "Eficiencia Energética en Instalaciones de Baja Tensión".</li>
                                                <li>IEC 60034-30 (Eficiencia de Motores).</li>
                                                <li>Video Capacitación Técnica: <a href="https://youtu.be/4wcmu9xsBdM" className="text-blue-600 underline">Guía de Implementación AEA 90364-8</a>.</li>
                                            </ul>
                                        </div>

                                        {/* Footer firma */}
                                        <div className="mt-12 pt-6 border-t border-slate-200 flex justify-between items-center avoid-break">
                                            <div className="text-xs text-slate-400">
                                                <p className="font-bold">Inteligencia Energética</p>
                                                <p>www.inteligenciaenergetica.com.ar</p>
                                            </div>
                                            <div className="text-right">
                                                <div className="h-16 w-32 bg-slate-50 mb-2 rounded flex items-end justify-center">
                                                    {/* Espacio para firma digital */}
                                                </div> 
                                                <p className="text-sm font-bold text-slate-800">Ing. Mariano Almada</p>
                                                <p className="text-xs text-slate-500">Gerente de Ingeniería</p>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer Flotante */}
                    {!showReport && (
                        <div className="fixed bottom-0 w-full bg-white border-t border-slate-200 p-4 shadow-lg z-30 no-print flex justify-between items-center max-w-4xl mx-auto left-0 right-0">
                            <div>
                                <div className="text-xs font-bold text-slate-400 uppercase">Puntaje</div>
                                <div className="text-2xl font-black text-slate-800">{totalScore}</div>
                            </div>
                            <div className={`px-4 py-1 rounded text-lg font-bold border ${getEiecColor(eiecClass).replace('text-white', 'text-slate-700').replace('bg-', 'border-')}`}>
                                {eiecClass}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Control de acceso compartido del Portal IE: auth.js inyecta la pantalla de login -->
